<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slowed Reverb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <img src="icons/icon24.png" alt="" width="24" height="24">
      <h1>Slowed Reverb</h1>
      <span id="status-pill" class="pill" data-state="idle">Waiting</span>
    </header>

    <p id="page-title" class="detail">YouTube Music</p>

    <section class="card" aria-label="Playback settings">
      <p class="readout" id="slow-readout">1.00x</p>
      <input type="range" id="slow-slider" min="0.7" max="1.3" step="0.01" value="1.00" aria-label="Playback speed">
      <p class="readout-sm" id="intensity-readout">0%</p>
      <input type="range" id="intensity-slider" min="0" max="1" step="0.01" value="0" aria-label="Reverb intensity">
    </section>

    <label class="toggle" for="power-toggle">
      <input type="checkbox" id="power-toggle" checked role="switch">
      <span>Active</span>
    </label>

    <footer>
      <button type="button" id="reset-btn">Reset</button>
    </footer>

    <p id="status-text" class="detail">Checking tab...</p>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
