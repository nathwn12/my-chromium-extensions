<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Presence Suite</title>
    <link rel="stylesheet" href="ui-kit/tokens.css" />
    <link rel="stylesheet" href="ui-kit/components.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <img src="icons/icon24.png" alt="" width="24" height="24" />
        <h1>Presence Suite</h1>
        <span id="bridge" class="pill" data-state="unknown" data-tone="waiting" role="status" aria-live="polite">Not connected</span>
      </header>

      <ul id="sources" class="sources" aria-label="Presence sources">
        <li class="source card" data-source="crunchy">
          <h2 class="source-name">Crunchyroll</h2>
          <p id="crunchy-now" class="now">Nothing playing</p>
          <p id="crunchy-detail" class="detail"></p>
          <label class="toggle" for="enabled-crunchy">
            <input id="enabled-crunchy" type="checkbox" switch role="switch" data-source="crunchy" checked />
            <span>Crunchyroll presence</span>
          </label>
        </li>
        <li class="source card" data-source="youtube-music">
          <h2 class="source-name">YouTube Music</h2>
          <p id="youtube-music-now" class="now">Nothing playing</p>
          <p id="youtube-music-detail" class="detail"></p>
          <label class="toggle" for="enabled-youtube-music">
            <input id="enabled-youtube-music" type="checkbox" switch role="switch" data-source="youtube-music" checked />
            <span>YouTube Music presence</span>
          </label>
        </li>
      </ul>

      <p id="reason" class="reason" role="status" aria-live="polite" hidden></p>

      <footer>
        <a id="open-options" href="options.html">Settings</a>
      </footer>
    </main>
    <script type="module" src="switch.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
