<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark" />
  <title>Audio Normalizer</title>
  <link rel="stylesheet" href="ui-kit/tokens.css" />
  <link rel="stylesheet" href="ui-kit/components.css" />
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <img src="icons/icon24.png" alt="" width="24" height="24">
      <h1>Audio Normalizer</h1>
      <span id="status-pill" class="pill" data-state="idle">Waiting</span>
    </header>

    <p id="hostname" class="detail">...</p>

    <label class="toggle" for="toggle">
      <input type="checkbox" id="toggle" switch role="switch">
      <span>Normalize this site</span>
    </label>

    <div class="gain">
      <div class="gain-head">
        <label for="gain-slider">Gain</label>
        <span id="gain-value" aria-live="polite">+0 dB</span>
      </div>
      <input type="range" id="gain-slider" min="-12" max="12" step="0.5" value="0">
    </div>

    <p id="status-text" class="detail" role="status">Checking…</p>

    <footer>
      <button type="button" id="reset-btn">Reset</button>
      <button type="button" id="exclude-btn" data-excluded="false">Exclude site</button>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
