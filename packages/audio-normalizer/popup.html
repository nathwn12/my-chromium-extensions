<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Normalizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <img src="icons/icon32.png" alt="" width="24" height="24">
      <h1>Audio Normalizer</h1>
      <span id="status-pill" class="pill" data-state="idle">Waiting</span>
    </header>

    <p id="hostname" class="detail">...</p>

    <section class="card" aria-label="Gain">
      <p class="gain-readout" id="gain-value">+0 dB</p>
      <input type="range" id="gain-slider" min="-12" max="12" step="0.5" value="0" aria-label="Adjust gain">
      <div class="preset-row" aria-label="Quick gain presets">
        <button type="button" class="preset-button" data-preset="speech">Speech</button>
        <button type="button" class="preset-button" data-preset="music">Music</button>
        <button type="button" class="preset-button" data-preset="boost">Boost</button>
      </div>
    </section>

    <label class="toggle" for="toggle">
      <input type="checkbox" id="toggle" aria-label="Toggle normalizer">
      <span>Active</span>
    </label>

    <p class="detail mode-note">Tab loudness moves toward a −20 LUFS program target, with quiet passages lifted and loud ones held back.</p>

    <footer>
      <button type="button" id="reset-btn">Reset</button>
    </footer>

    <p id="status-text" class="detail">Checking…</p>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
