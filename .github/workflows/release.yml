name: release

# One release per extension, overwritten in place. A run builds and replaces only
# the product named by its stable tag or manual product choice.
on:
  push:
    tags:
      - audio-normalizer
      - slowed-reverb
      - crunchy-presence
      - youtube-music-presence
      - presence-suite
  workflow_dispatch:
    inputs:
      product:
        description: Product to release
        required: true
        type: choice
        options:
          - audio-normalizer
          - slowed-reverb
          - crunchy-presence
          - youtube-music-presence
          - presence-suite

permissions:
  contents: write

# One release run at a time. Queued, never cancelled.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.product || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Zip selected extension
        env:
          PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          case "$PRODUCT" in
            audio-normalizer)
              (cd packages/audio-normalizer && zip -r ../../dist/audio-normalizer.zip manifest.json background.js shared.js content-script.js page-hook.js audio/normalizer-worklet.js popup.html popup.css popup.js icons/icon16.png icons/icon24.png icons/icon32.png icons/icon48.png icons/icon128.png ui-kit/tokens.css ui-kit/components.css)
              ;;
            slowed-reverb)
              (cd packages/slowed-reverb && zip -r ../../dist/slowed-reverb.zip manifest.json background.js shared.js player-actions.js content-script.js page-hook.js dattorro-worklet.js popup.html popup.css popup.js icons/icon16.png icons/icon24.png icons/icon32.png icons/icon48.png icons/icon128.png ui-kit/tokens.css ui-kit/components.css)
              ;;
            crunchy-presence)
              (cd packages/crunchy-presence && zip -r ../../dist/crunchy-presence.zip manifest.json background.js bridge-status.js config.js extract.js content.js popup.html popup.css popup.js options.html options.css options.js icons/icon16.png icons/icon24.png icons/icon32.png icons/icon48.png icons/icon128.png native/host.mjs native/arrpc.mjs native/ipc.mjs native/protocol.mjs scripts/extension-key.mjs scripts/install-host.mjs scripts/uninstall-host.mjs ui-kit/tokens.css ui-kit/components.css)
              ;;
            youtube-music-presence)
              (cd packages/youtube-music-presence && zip -r ../../dist/youtube-music-presence.zip manifest.json background.js config.js activity.js bridge-status.js content.js extract-youtube.js popup.html popup.css popup.js options.html options.css options.js icons/icon16.png icons/icon24.png icons/icon32.png icons/icon48.png icons/icon128.png native/host.mjs native/arrpc.mjs native/ipc.mjs native/native-framing.mjs scripts/extension-key.mjs scripts/install-host.mjs scripts/uninstall-host.mjs ui-kit/tokens.css ui-kit/components.css)
              ;;
            presence-suite)
              (cd packages/presence-suite && zip -r ../../dist/presence-suite.zip manifest.json background.js config.js activity.js bridge-status.js content.js extract-youtube.js popup.html popup.css popup.js options.html options.css options.js icons/icon16.png icons/icon24.png icons/icon32.png icons/icon48.png icons/icon128.png sources/crunchy/extract.js sources/crunchy/content.js sources/crunchy/activity.js sources/crunchy/frame-merge.js ui-kit/tokens.css ui-kit/components.css native/host.mjs native/ipc.mjs native/arrpc.mjs native/native-framing.mjs scripts/extension-key.mjs scripts/install-host.mjs scripts/uninstall-host.mjs)
              ;;
            *) echo "Unsupported product: $PRODUCT" >&2; exit 1 ;;
          esac
          zip -r "dist/$PRODUCT.zip" scripts/install-extension.mjs
          unzip -l "dist/$PRODUCT.zip"

      - name: Check release asset
        env:
          PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || github.ref_name }}
        run: node scripts/check-release-asset.mjs --zip "dist/$PRODUCT.zip" --product "$PRODUCT"

      - name: Overwrite selected release
        env:
          PRODUCT: ${{ github.event_name == 'workflow_dispatch' && inputs.product || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            audio-normalizer|slowed-reverb|crunchy-presence|youtube-music-presence|presence-suite) ;;
            *) echo "Unsupported product: $PRODUCT" >&2; exit 1 ;;
          esac

          version() { node -p "require('./packages/$1/manifest.json').version"; }
          name() { node -p "require('./packages/$1/manifest.json').name"; }

          publish() { # $1 package dir = $2 tag
            local pkg="$1" tag="$2" title body
            title="$(name "$pkg") $(version "$pkg")"
            body="$(node scripts/release-body.mjs "$pkg")"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes "$body"
            else
              gh release create "$tag" --title "$title" --notes "$body"
            fi
            gh release upload "$tag" "dist/$pkg.zip" --clobber
          }

          publish "$PRODUCT" "$PRODUCT"
