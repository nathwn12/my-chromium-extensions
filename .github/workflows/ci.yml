# A docs-only change (*.md, docs/, LICEN[CS]E) keeps the required check green and runs no build.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bun installs and runs the scripts; Node remains the runtime (engines.node 26 and
# the tests' node:test semantics). Every install job pins bun 1.4.4 and uses the
# committed bun.lock with --frozen-lockfile.
jobs:
  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the scope step below diffs against the base branch with
          # `...`, which needs a merge base (and, on a push, the `before` commit).
          fetch-depth: 0
      - name: Detect a docs-only change
        id: scope
        shell: bash
        run: |
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            changed=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            changed=$(git ls-files)
          fi
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - name: Verify integration (reads the tree, installs nothing)
        if: steps.scope.outputs.code == 'true'
        run: node scripts/verify-integration.mjs

      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"

