# nathwn12 house CI - four extensions plus a shared presence suite
#
# Required check on main is the JOB NAME `root-gate` - do not rename it.
# `root-gate` runs the root `bun run test`, which fans out to all five package
# test scripts. The duplicated per-package `Tests` steps were removed: the
# proof kept is root-gate's `bun run test` (same five scripts, one install).
# Each other job keeps only its unique proof (QA, lint, typecheck, selftest,
# native IPC e2e). Cheap checks run first in `static`; jobs stay parallel so a
# slow audio QA does not serialize behind the root suite.
#
# release.yml has NO workflow_run dependency on ci job names: it is tag/dispatch
# driven, so renaming nothing here cannot break a release.
# A docs-only change keeps the required check green; scope is API-based.
# No package slicing is added: the per-package jobs already are the slice, and
# main runs all of them.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  static:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Scope from the GitHub API
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          docs='^(.*\.md|docs/.*|LICEN[CS]E(\.md)?)$'
          files=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' || true)
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --paginate --jq '.files[].filename' || true)
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
      - name: Cache bun install
        if: steps.scope.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install (root lockfile)
        if: steps.scope.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - name: Verify integration (reads the tree, installs nothing)
        if: steps.scope.outputs.code == 'true'
        run: node scripts/verify-integration.mjs
      - name: Version coherence
        if: steps.scope.outputs.code == 'true'
        run: node scripts/check-versions.mjs
      - name: Lint (slowed-reverb)
        if: steps.scope.outputs.code == 'true'
        working-directory: packages/slowed-reverb
        run: bun run lint
      - name: Typecheck (audio-normalizer)
        if: steps.scope.outputs.code == 'true'
        working-directory: packages/audio-normalizer
        run: bun run typecheck
      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - the required check stays green' }}"

