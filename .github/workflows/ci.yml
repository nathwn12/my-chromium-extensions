name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bun installs and runs the scripts; Node remains the runtime (engines.node 26 and
# the tests' node:test semantics). Every install job pins bun 1.4.4 and uses the
# committed bun.lock with --frozen-lockfile.
jobs:
  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify integration (reads the tree, installs nothing)
        run: node scripts/verify-integration.mjs

  audio-normalizer:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install (root lockfile)
        run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/audio-normalizer
        run: bun run test
      - name: Feed transition QA
        working-directory: packages/audio-normalizer
        run: node qa/feed-transition-qa.cjs
      - name: Program boundary QA
        working-directory: packages/audio-normalizer
        run: node qa/program-boundary-qa.cjs
      - name: Typecheck
        working-directory: packages/audio-normalizer
        run: bun run typecheck

  slowed-reverb:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install (root lockfile)
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: packages/slowed-reverb
        run: bun run lint
      - name: Tests
        working-directory: packages/slowed-reverb
        run: bun run test

  crunchy-presence:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install (root lockfile)
        run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/crunchy-presence
        run: bun run test
      - name: Native host selftest
        working-directory: packages/crunchy-presence
        run: bun run selftest

  web-discord-rpc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install (root lockfile)
        run: bun install --frozen-lockfile
      - name: Tests
        working-directory: packages/web-discord-rpc
        run: bun run test
      - name: Native host selftest
        working-directory: packages/web-discord-rpc
        run: node native/host.mjs --selftest
      - name: arRPC e2e
        working-directory: packages/web-discord-rpc
        run: node scripts/e2e-arrpc.mjs
      - name: Discord IPC e2e (self-skips off Windows)
        working-directory: packages/web-discord-rpc
        run: node scripts/e2e-ipc.mjs
