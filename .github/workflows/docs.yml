name: docs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Strict docs gate
        run: node scripts/docs-check.mjs --strict
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Markdown corruption guard
        run: bun run docs:lint:md
      - name: YAML/JSON corruption guard
        run: bun run docs:lint:yaml
