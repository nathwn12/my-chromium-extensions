name: docs
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Strict docs gate
        run: node scripts/docs-check.mjs --strict
